
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Date 💗</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ffe3ef,#f5dfff,#fff5f8);
  color:#9c416f;
}

.card{
  width:100%;
  max-width:430px;
  background:white;
  padding:30px 22px;
  border-radius:28px;
  text-align:center;
  box-shadow:0 15px 50px #b85e8830;
}

.page{display:none}
.page.active{display:block}

.heart{font-size:55px}
h1{font-size:30px;line-height:1.3}
p{color:#a87b94;line-height:1.6}

button,input,select{font:inherit}

button{
  border:0;
  border-radius:15px;
  padding:15px;
  cursor:pointer;
  font-weight:bold;
}

button:focus-visible,
input:focus-visible,
select:focus-visible{
  outline:3px solid #9c416f;
  outline-offset:3px;
}

.buttons{
  display:flex;
  gap:12px;
  margin-top:25px;
}

.buttons button{flex:1}

.yes,.confirm{
  background:#e65b9a;
  color:white;
}

.no,.back{
  background:#fceaf2;
  color:#a34c78;
}

.field{
  text-align:left;
  margin:18px 0;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:14px;
  border:1px solid #f0c4d8;
  border-radius:13px;
  background:#fff8fb;
  color:#803b63;
}

.confirm{width:100%;margin-top:12px}
.back{margin-top:12px}

.result-box{
  background:#fff0f6;
  padding:18px 15px;
  border-radius:16px;
  margin-top:20px;
  overflow-wrap:anywhere;
}

.result-box p{margin:14px 0}

.footer{
  margin-top:25px;
  color:#c28ba7;
  font-size:13px;
}
</style>
</head>

<body>
<div class="card">

  <!-- PAGE 1: INVITATION -->
  <section id="page1" class="page active">
    <div class="heart">💌</div>
    <h1>Will you go out with me?</h1>
    <p>
      I have a little question for you...<br>
      Will you spend a special day with me? 💗
    </p>

    <div class="buttons">
      <button class="yes" onclick="showPage('page2')">
        Yes! 💖
      </button>
      <button class="no" onclick="noClick()">
        No 🙈
      </button>
    </div>

    <p id="message" aria-live="polite"></p>
  </section>


  <!-- PAGE 2: DATE FORM -->
  <section id="page2" class="page">
    <div class="heart">🌷</div>
    <h1>Let's plan our date!</h1>
    <p>Choose your favorite date plan ✨</p>

    <form id="dateForm">
      <div class="field">
        <label for="date">📅 Date</label>
        <input type="date" id="date" required>
      </div>

      <div class="field">
        <label for="time">⏰ Time</label>
        <input type="time" id="time" required>
      </div>

      <div class="field">
        <label for="activity">💕 What should we do?</label>
        <select id="activity" required>
          <option value="">Choose an activity</option>
          <option>🎬 Watch a movie</option>
          <option>🍽️ Dinner together</option>
          <option>☕ Go to a cafe</option>
          <option>🌆 Evening walk</option>
          <option>🎡 Fun activities</option>
        </select>
      </div>

      <div class="field">
        <label for="location">📍 Location</label>
        <input
          id="location"
          type="text"
          placeholder="Where should we meet?"
          required
        >
      </div>

      <button class="confirm" type="submit">
        Save Our Date 💗
      </button>
    </form>

    <button class="back" type="button" onclick="showPage('page1')">
      ← Back
    </button>
  </section>


  <!-- PAGE 3: FINAL SUMMARY -->
  <section id="page3" class="page">
    <div class="heart">💖</div>
    <h1>It's a date!</h1>
    <p>Your date plan has been confirmed ✨</p>

    <div class="result-box" id="result"></div>

    <p>Can't wait to see you! 🌷</p>

    <button class="back" onclick="showPage('page2')">
      ← Edit Our Date
    </button>

    <button class="confirm" onclick="startOver()">
      Start Over 💗
    </button>
  </section>

  <div class="footer">Made with love 💗</div>
</div>


<script>
let count = 0;

const messages = [
  "Are you sure? 🥺",
  "That's okay! 💗",
  "Thanks for being honest 🌷"
];

// Switch between pages
function showPage(pageId){
  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  document.getElementById(pageId).classList.add("active");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

// No button
function noClick(){
  document.getElementById("message").textContent =
    messages[count % messages.length];
  count++;
}

// Submit the date form and show the FINAL summary page
document.getElementById("dateForm").addEventListener("submit", function(e){
  e.preventDefault();

  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;
  const activity = document.getElementById("activity").value;
  const location = document.getElementById("location").value.trim();

  if(!date || !time || !activity || !location){
    alert("Please complete all fields 💗");
    return;
  }

  const dateText = new Date(date + "T12:00:00")
    .toLocaleDateString("en-US", {
      year: "numeric",
      month: "long",
      day: "numeric"
    });

  const result = document.getElementById("result");
  result.replaceChildren();

  const details = [
    ["📅 Date", dateText],
    ["⏰ Time", time],
    ["💕 Activity", activity],
    ["📍 Location", location]
  ];

  details.forEach(([label, value]) => {
    const p = document.createElement("p");
    const strong = document.createElement("strong");

    strong.textContent = label + ": ";
    p.append(strong, document.createTextNode(value));
    result.appendChild(p);
  });

  // Go to page 3 only after saving the form
  showPage("page3");
});

// Start over
function startOver(){
  document.getElementById("dateForm").reset();
  document.getElementById("message").textContent = "";
  count = 0;
  showPage("page1");
}
</script>

</body>
</html>
